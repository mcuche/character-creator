name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dragonbane-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dragonbane-app/package-lock.json

      - run: npm ci

      # The site is served from https://<user>.github.io/<repo>/, so the base href must match the repo name.
      - run: npx ng build --base-href "/${{ github.event.repository.name }}/"

      # GitHub Pages has no SPA fallback: serve index.html for deep links like /character/:id on refresh.
      - run: cp dist/dragonbane-app/browser/index.html dist/dragonbane-app/browser/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dragonbane-app/dist/dragonbane-app/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
