<!doctype html>

<title>Dragonbane Graphics</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Skranji:wght@400;700&family=Vollkorn:wght@400;600&display=swap">
<style>
  body { margin: 0; padding: 40px 16px 80px; background: oklch(0.13 0.008 68); color: oklch(0.88 0.008 70); font-family: 'Vollkorn', Georgia, serif; }
  main { max-width: 1040px; margin: 0 auto; }
  h1 { font-family: 'Skranji', serif; font-size: 2.25rem; margin: 0 0 4px; color: oklch(0.74 0.13 72); letter-spacing: 0.02em; }
  h2 { font-family: 'Skranji', serif; text-transform: capitalize; font-size: 1.35rem; margin: 48px 0 16px; color: oklch(0.80 0.01 70); border-bottom: 1px solid oklch(0.22 0.008 68); padding-bottom: 8px; }
  p { color: oklch(0.62 0.01 70); margin: 0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
  .card { margin: 0; padding: 24px 12px 14px; background: oklch(0.16 0.008 68); border: 1px solid oklch(0.22 0.008 68); border-radius: 6px; display: flex; flex-direction: column; align-items: center; gap: 14px; color: oklch(0.62 0.012 70); transition: color 240ms cubic-bezier(0.22,1,0.36,1), border-color 240ms; }
  .card:hover { color: oklch(0.74 0.13 72); border-color: oklch(0.35 0.06 72); }
  .card svg { width: 72px; height: 72px; }
  .card.wide { grid-column: span 2; }
  .card.wide svg { width: 100%; height: 32px; }
  figcaption { font-size: 0.78rem; color: oklch(0.55 0.009 68); text-align: center; word-break: break-all; }
</style>
</head>
