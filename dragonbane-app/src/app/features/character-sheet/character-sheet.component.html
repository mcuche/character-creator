@if (character(); as char) {
<div class="min-h-screen bg-stone-900 text-stone-100">
  <!-- Header -->
  <header class="sticky top-0 z-20 border-b border-amber-800/40 bg-stone-950/95 px-6 py-4 backdrop-blur">
    <div class="mx-auto flex max-w-4xl items-center gap-4">
      <a routerLink="/" class="font-display text-lg font-bold text-amber-400 hover:text-amber-300">Dragonbane</a>
      <span class="text-stone-300">/</span>
      <div class="flex gap-2">
        <button (click)="exportJson()" class="rounded-lg border border-stone-700 px-3 py-1 text-xs text-stone-300 hover:text-stone-300">↓ JSON</button>
      </div>
    </div>
    <div class="mx-auto max-w-4xl pt-3">
      <app-sheet-vitals [character]="char" (patch)="patch($event)" />
    </div>
  </header>

  <!-- Tab navigation -->
  <div class="border-b border-stone-800 px-6">
    <div class="mx-auto flex max-w-4xl gap-1">
      @for (tab of tabs; track tab.id) {
        <button
          (click)="activeTab.set(tab.id)"
          class="border-b-2 px-4 py-3 text-sm font-medium transition"
          [class.border-amber-500]="activeTab() === tab.id"
          [class.text-amber-300]="activeTab() === tab.id"
          [class.border-transparent]="activeTab() !== tab.id"
          [class.text-stone-300]="activeTab() !== tab.id">
          {{ tab.label }}
        </button>
      }
    </div>
  </div>

  <main class="mx-auto max-w-4xl px-6 py-8">
    @switch (activeTab()) {
      @case ('core') { <app-sheet-core [character]="char" (patch)="patch($event)" /> }
      @case ('skills') { <app-sheet-skills [character]="char" (patch)="patch($event)" /> }
      @case ('abilities') { <app-sheet-abilities [character]="char" /> }
      @case ('gear') { <app-sheet-gear [character]="char" (patch)="patch($event)" /> }
    }
  </main>
</div>
}
