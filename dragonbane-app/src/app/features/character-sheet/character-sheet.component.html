@if (character(); as char) {
<div class="min-h-dvh bg-page">

  <!-- Pinned block: nav row, vitals, tab bar -->
  <header class="sticky top-0 z-20 site-header">
    <div class="mx-auto max-w-3xl px-4 sm:px-6">
      <div class="flex items-center justify-between gap-4">
        <a routerLink="/" class="wizard-home-link inline-flex min-h-11 items-center gap-2" aria-label="Back to roster">
          <app-icon class="nav-arrow" name="ui/caret-left" [size]="14" />
          Roster
        </a>
        <button (click)="exportJson()" class="btn-roll-action min-h-11 px-4!" aria-label="Export character as JSON">
          Export
        </button>
      </div>

      <app-sheet-vitals [character]="char" (patch)="patch($event)" />

      <nav class="sheet-tabs" role="tablist" aria-label="Character sheet sections">
        @for (tab of tabs; track tab.id) {
          <button
            role="tab"
            [id]="'sheet-tab-' + tab.id"
            [attr.aria-selected]="activeTab() === tab.id"
            aria-controls="sheet-panel"
            (click)="activeTab.set(tab.id)"
            class="sheet-tab"
            [class.active]="activeTab() === tab.id">
            {{ tab.label }}
          </button>
        }
      </nav>
    </div>
  </header>

  <main
    id="sheet-panel"
    role="tabpanel"
    [attr.aria-labelledby]="'sheet-tab-' + activeTab()"
    class="mx-auto max-w-3xl px-4 pt-6 pb-24 sm:px-6">
    @switch (activeTab()) {
      @case ('core') { <app-sheet-core [character]="char" (patch)="patch($event)" /> }
      @case ('skills') { <app-sheet-skills [character]="char" (patch)="patch($event)" /> }
      @case ('abilities') { <app-sheet-abilities [character]="char" /> }
      @case ('gear') { <app-sheet-gear [character]="char" (patch)="patch($event)" /> }
    }
  </main>
</div>
}
