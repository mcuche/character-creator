@let char = character();

<app-sheet-combat
  [character]="char"
  [encumbrance]="encumbrance()"
  (patch)="patch.emit($event)" />

<app-gear-list
  [gear]="char.gear"
  [encumbrance]="encumbrance()"
  [str]="str()"
  (gearChange)="setGear($event)" />

<!-- ── Coin ── -->
<section class="mt-10" aria-labelledby="gear-coin-heading">
  <h3 id="gear-coin-heading" class="mb-1 section-label">Coin</h3>
  <div class="sm:max-w-sm">
    @for (coin of coins; track coin.key) {
      @let amount = char[coin.key];
      <div class="attr-row justify-between gap-3! py-2!">
        <span class="attr-row-key" [class]="'coin-' + coin.key">{{ coin.label }}</span>
        <div class="flex items-center gap-2" role="group" [attr.aria-label]="coin.label + ' coins'">
          <button
            (click)="updateCurrency(coin.key, -1)"
            [disabled]="amount <= 0"
            class="vital-stepper"
            [attr.aria-label]="'One less ' + coin.label.toLowerCase()">−</button>
          <div class="w-16">
            <input
              #field
              type="number"
              inputmode="numeric"
              min="0"
              step="1"
              [value]="amount"
              (change)="commitCurrency(coin.key, field)"
              (keydown.enter)="field.blur()"
              [attr.aria-label]="coin.label + ' amount'"
              class="text-field num-field"
            />
          </div>
          <button
            (click)="updateCurrency(coin.key, 1)"
            class="vital-stepper"
            [attr.aria-label]="'One more ' + coin.label.toLowerCase()">+</button>
        </div>
      </div>
    }
  </div>
</section>

<!-- ── Memento ── -->
@if (char.memento) {
  <section class="mt-10" aria-labelledby="gear-memento-heading">
    <h3 id="gear-memento-heading" class="mb-1 section-label">Memento</h3>
    <div class="attr-row items-start!">
      <div class="min-w-0 flex-1">
        <p class="break-words toggle-card-name">{{ char.memento.name }}</p>
        @if (char.memento.significance) {
          <p class="mt-1 break-words card-meta">{{ char.memento.significance }}</p>
        }
      </div>
    </div>
  </section>
}
