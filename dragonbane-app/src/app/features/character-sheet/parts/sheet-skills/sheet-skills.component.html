<section class="mb-6">
  <h3 class="font-display mb-4 text-lg font-semibold text-stone-200">Trained Skills</h3>
  <div class="space-y-1">
    @for (skill of trainedSkills(); track skill.name) {
      <div class="flex items-center gap-3 rounded-lg border border-stone-700 bg-stone-800/40 px-3 py-2">
        <div class="flex-1">
          <span class="font-medium text-stone-100">{{ skill.name }}</span>
          <span class="ml-2 text-xs text-stone-300">{{ getSkillAttr(skill.name) }}</span>
        </div>
        <input
          type="number"
          [ngModel]="skill.level"
          (ngModelChange)="updateSkillLevel(skill.name, +$event)"
          min="1" max="18"
          class="w-12 rounded bg-stone-900 text-center font-mono font-bold text-amber-400 outline-none focus:ring-1 focus:ring-amber-500"
        />
        <!-- Advancement marks -->
        <button
          (click)="toggleAdvancementMark(skill.name)"
          class="flex gap-0.5"
          title="Advancement marks (click to cycle)">
          @for (i of [0,1]; track i) {
            <span class="h-3 w-3 rounded-sm border"
              [class.border-amber-500]="skill.advancementMarks > i"
              [class.bg-amber-500]="skill.advancementMarks > i"
              [class.border-stone-600]="skill.advancementMarks <= i">
            </span>
          }
        </button>
      </div>
    }
  </div>
</section>

<section>
  <h3 class="font-display mb-4 text-lg font-semibold text-stone-300">Untrained Skills</h3>
  <div class="space-y-1 opacity-60">
    @for (skill of untrainedSkills(); track skill.name) {
      <div class="flex items-center gap-3 rounded-lg border border-stone-800 px-3 py-2">
        <div class="flex-1">
          <span class="text-stone-300">{{ skill.name }}</span>
          <span class="ml-2 text-xs text-stone-300">{{ getSkillAttr(skill.name) }}</span>
        </div>
        <span class="font-mono text-stone-300">{{ skill.level }}</span>
      </div>
    }
  </div>
</section>
