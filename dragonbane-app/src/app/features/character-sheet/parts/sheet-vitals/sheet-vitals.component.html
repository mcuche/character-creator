@let char = character();

<div class="flex flex-col gap-2.5">

  <!-- Name + identity -->
  <div class="flex flex-col items-center gap-1">
    <div class="flex w-full justify-center">
      <input
        type="text"
        [ngModel]="char.name"
        (ngModelChange)="updateName($event)"
        placeholder="Unnamed hero"
        aria-label="Character name"
        autocomplete="off"
        spellcheck="false"
        class="hero-name-input sheet-name-input"
      />
    </div>
    @if (identity()) {
      <p class="char-list-meta flex items-center gap-2">
        @if (char.profession) {
          <app-icon [name]="'professions/' + char.profession.toLowerCase()" [size]="18" />
        }
        <span>{{ identity() }}</span>
      </p>
    }
  </div>

  <!-- HP / WP -->
  <div class="derived-secondary mb-0!">
    <div class="vital-hp flex flex-1 items-center justify-between gap-1 px-1.5 py-1.5" role="group" aria-label="Hit points">
      <button
        type="button"
        class="vital-stepper"
        (click)="updateCurrentHP(-1)"
        [disabled]="char.currentHP <= 0"
        aria-label="Lose 1 hit point">−</button>
      <div class="flex flex-col items-center gap-0.5">
        <span class="vital-label">HP</span>
        <span class="vital-value text-3xl/none!" aria-live="polite">{{ char.currentHP }}<span class="vital-value-unit text-base!">/{{ maxHP() }}</span></span>
      </div>
      <button
        type="button"
        class="vital-stepper"
        (click)="updateCurrentHP(1)"
        [disabled]="char.currentHP >= maxHP()"
        aria-label="Recover 1 hit point">+</button>
    </div>

    <div class="secondary-rule" aria-hidden="true"></div>

    <div class="vital-wp flex flex-1 items-center justify-between gap-1 px-1.5 py-1.5" role="group" aria-label="Willpower points">
      <button
        type="button"
        class="vital-stepper"
        (click)="updateCurrentWP(-1)"
        [disabled]="char.currentWP <= 0"
        aria-label="Spend 1 willpower point">−</button>
      <div class="flex flex-col items-center gap-0.5">
        <span class="vital-label">WP</span>
        <span class="vital-value text-3xl/none!" aria-live="polite">{{ char.currentWP }}<span class="vital-value-unit text-base!">/{{ maxWP() }}</span></span>
      </div>
      <button
        type="button"
        class="vital-stepper"
        (click)="updateCurrentWP(1)"
        [disabled]="char.currentWP >= maxWP()"
        aria-label="Recover 1 willpower point">+</button>
    </div>
  </div>

  <!-- Conditions -->
  <div class="grid grid-cols-3 gap-1.5 sm:grid-cols-6" role="group" aria-label="Conditions">
    @for (cond of conditions; track cond) {
      <button
        type="button"
        class="condition-toggle"
        [class.active]="hasCondition(cond)"
        [attr.aria-pressed]="hasCondition(cond)"
        (click)="toggleCondition(cond)">
        <span class="condition-toggle-name">{{ cond }}</span>
        <span class="condition-toggle-attr"><span class="sr-only">Bane on </span>{{ conditionAttrs[cond] }}</span>
      </button>
    }
  </div>

</div>
