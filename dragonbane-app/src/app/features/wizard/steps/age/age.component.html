<div class="step-animate-in">

  @if (pendingAge()) {
    <app-confirm-modal
      title="Change Age?"
      [message]="'Changing to ' + pendingAge() + ' will reset your attribute scores and all trained skill selections, since age modifiers affect attribute values.'"
      confirmLabel="Change Age"
      (confirm)="confirmChange()"
      (cancel)="cancelChange()" />
  }

  <div class="mb-2 flex items-baseline justify-between">
    <h2 class="font-display font-semibold step-heading">
      Choose Your Age
    </h2>
    <button (click)="rollRandom()" class="btn-roll">Roll D6</button>
  </div>
  <p class="mb-8 step-intro">
    Age shapes your attribute modifiers and the number of trained skills you begin with.
  </p>

  <div class="grid gap-3 lg:grid-cols-3">
    @for (age of ageOptions; track age.name; let i = $index) {
      <button
        (click)="select(age.name)"
        class="select-card"
        [class.selected]="selected === age.name">

        <!-- Age sigil -->
        <div class="card-sigil">
          <app-icon [name]="'age/' + age.name.toLowerCase()" [size]="64" />
        </div>

        <!-- Age info -->
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-2 mb-1">
            <span class="font-display font-semibold card-title">
              {{ age.name }}
            </span>
            @if (rolledIndex() === i) {
              <span class="rolled-badge">Rolled</span>
            }
          </div>
          <p class="font-display mb-1 card-ability-name">{{ age.skills }} trained skills</p>
          @if (age.modifiers.length === 0) {
            <p class="card-ability-desc">No modifiers</p>
          } @else {
            <div class="age-mods">
              <div>
                @for (m of age.modifiers; track m.attr) {
                  @if (m.delta < 0) {
                    <div class="mod-neg">{{ m.attr }} {{ m.delta }}</div>
                  }
                }
              </div>
              <div>
                @for (m of age.modifiers; track m.attr) {
                  @if (m.delta > 0) {
                    <div class="mod-pos">{{ m.attr }} +{{ m.delta }}</div>
                  }
                }
              </div>
            </div>
          }
        </div>

      </button>
    }
  </div>

  <app-step-nav [backPath]="backPath" [canContinue]="!!selected" (next)="continue()" />

</div>
