<div class="step-animate-in">

  @if (pendingAge()) {
    <app-confirm-modal
      title="Change Age?"
      [message]="'Changing to ' + pendingAge() + ' will reset your attribute scores and all trained skill selections, since age modifiers affect attribute values.'"
      confirmLabel="Change Age"
      (confirm)="confirmChange()"
      (cancel)="cancelChange()" />
  }

  <div class="mb-2 flex items-baseline justify-between">
    <h2 class="font-display font-semibold step-heading">
      Choose Your Age
    </h2>
    <button (click)="rollRandom()" class="btn-roll">Roll D6</button>
  </div>
  <p class="mb-8 step-intro">
    Age shapes your attribute modifiers and the number of trained skills you begin with.
  </p>

  <div class="grid gap-3 sm:grid-cols-3">
    @for (age of ageOptions; track age.name; let i = $index) {
      <button
        (click)="select(age.name)"
        class="select-card"
        [class.selected]="selected === age.name">

        <!-- Age sigil -->
        <div class="card-sigil">
          @switch (age.name) {
            @case ('Young') {
              <svg width="44" height="44" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Young" role="img">
                <line x1="14" y1="74" x2="86" y2="74" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
                <line x1="30" y1="74" x2="30" y2="50" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
                <line x1="50" y1="74" x2="50" y2="20" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
                <line x1="70" y1="74" x2="70" y2="50" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
              </svg>
            }
            @case ('Adult') {
              <svg width="44" height="44" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Adult" role="img">
                <circle cx="50" cy="50" r="30" stroke="currentColor" stroke-width="2.5"/>
                <line x1="18" y1="50" x2="82" y2="50" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
                <circle cx="50" cy="50" r="6" fill="currentColor"/>
              </svg>
            }
            @case ('Old') {
              <svg width="44" height="44" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="Old" role="img">
                <line x1="18" y1="14" x2="82" y2="14" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
                <line x1="18" y1="86" x2="82" y2="86" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
                <line x1="18" y1="14" x2="82" y2="86" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
                <line x1="82" y1="14" x2="18" y2="86" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
                <circle cx="50" cy="50" r="4" fill="currentColor"/>
              </svg>
            }
          }
        </div>

        <!-- Age info -->
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-2 mb-1">
            <span class="font-display font-semibold card-title">
              {{ age.name }}
            </span>
            @if (rolledIndex() === i) {
              <span class="rolled-badge">Rolled</span>
            }
          </div>
          <p class="font-display mb-1 card-ability-name">{{ age.skills }} trained skills</p>
          @if (age.modifiers.length === 0) {
            <p class="card-ability-desc">No modifiers</p>
          } @else {
            <div class="age-mods">
              <div>
                @for (m of age.modifiers; track m.attr) {
                  @if (m.delta < 0) {
                    <div class="mod-neg">{{ m.attr }} {{ m.delta }}</div>
                  }
                }
              </div>
              <div>
                @for (m of age.modifiers; track m.attr) {
                  @if (m.delta > 0) {
                    <div class="mod-pos">{{ m.attr }} +{{ m.delta }}</div>
                  }
                }
              </div>
            </div>
          }
        </div>

      </button>
    }
  </div>

  <app-step-nav [backPath]="backPath" [canContinue]="!!selected" (next)="continue()" />

</div>
