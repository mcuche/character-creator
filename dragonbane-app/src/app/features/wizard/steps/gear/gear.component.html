<div class="step-animate-in">

  <h2 class="mb-2 font-display font-semibold step-heading">Starting Gear</h2>
  <p class="mb-8 step-intro">
    Your suggested loadout is pre-filled. Tick what you wear and wield: worn armor, a helmet and up to three weapons at hand don't count toward your load.
  </p>

  <app-gear-list
    [gear]="gear()"
    [encumbrance]="encumbrance()"
    [str]="str()"
    [note]="str() === null ? 'Set your attributes to see how much you can carry.' : undefined"
    (gearChange)="gear.set($event)" />

  <app-step-nav
    backPath="weakness"
    [canContinue]="true"
    (next)="continue()" />

</div>
