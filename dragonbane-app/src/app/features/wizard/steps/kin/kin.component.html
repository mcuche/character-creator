<div class="step-animate-in">

  <div class="mb-2 flex items-baseline justify-between">
    <h2 class="font-display font-semibold step-heading">
      Choose Your Kin
    </h2>
    <button (click)="rollRandom()" class="btn-roll">Roll D12</button>
  </div>
  <p class="mb-8 step-intro">
    Your kin determines your base movement and innate ability.
  </p>

  <div class="grid gap-3 sm:grid-cols-2">
    @for (kin of kinOptions; track kin.name; let i = $index) {
      <button
        (click)="select(kin.name)"
        class="select-card"
        [class.selected]="selected === kin.name">

        <!-- Kin sigil -->
        <div class="card-sigil">
          <app-icon [name]="'kin/' + kin.name.toLowerCase()" [size]="44" />
        </div>

        <!-- Kin info -->
        <div class="flex-1 min-w-0">
          <div class="flex items-center gap-2 mb-1">
            <span class="font-display font-semibold card-title">
              {{ kin.name }}
            </span>
            @if (rolledIndex() === i) {
              <span class="rolled-badge">Rolled</span>
            }
          </div>
          <p class="card-meta">Move {{ kin.move }}m</p>
          <div class="mt-3">
            @if (kin.innateAbilities) {
              @for (ability of kin.innateAbilities; track ability.name) {
                <p class="font-display mb-1 card-ability-name">
                  {{ ability.name }}
                  <span class="font-body card-ability-cost">
                    · {{ ability.wp === 'free' ? 'Free' : ability.wp + ' WP' }}
                  </span>
                </p>
                <p class="card-ability-desc mb-2">
                  {{ ability.description }}
                </p>
              }
            } @else {
              <p class="font-display mb-1 card-ability-name">
                {{ kin.innateAbilityName }}
                <span class="font-body card-ability-cost">
                  · {{ kin.innateAbilityWP === 'free' ? 'Free' : kin.innateAbilityWP + ' WP' }}
                </span>
              </p>
              <p class="card-ability-desc">
                {{ kin.innateAbilityDescription }}
              </p>
            }
          </div>
        </div>

      </button>
    }
  </div>

  <app-step-nav [canContinue]="!!selected" (next)="continue()" />

</div>
