<div class="step-animate-in">

  @if (pendingProfession()) {
    <app-confirm-modal
      title="Change Profession?"
      [message]="'Changing to ' + pendingProfession() + ' will reset your free skill picks.'"
      confirmLabel="Change Profession"
      (confirm)="confirmChange()"
      (cancel)="cancelChange()" />
  }

  <div class="mb-2 flex items-baseline justify-between">
    <h2 class="font-display font-semibold step-heading">
      Choose Your Profession
    </h2>
    <button (click)="rollRandom()" class="btn-roll">Roll D10</button>
  </div>
  <p class="mb-8 step-intro">
    Your profession grants a heroic ability and defines your core skills.
  </p>

  <div class="grid gap-3 sm:grid-cols-2">
    @for (prof of professions; track prof.name; let i = $index) {
      <button
        (click)="select(prof.name)"
        class="prof-card"
        [class.prof-selected]="selected === prof.name">

        <!-- Top bar: dice number + rolled badge + key attribute -->
        <div class="prof-top-bar">
          <div class="flex items-center gap-2 flex-1 min-w-0">
            <span class="prof-dice-num">D10 · {{ prof.diceRange }}</span>
            @if (rolledIndex() === i) {
              <span class="rolled-badge">Rolled</span>
            }
          </div>
          <span class="prof-attr-badge">{{ prof.keyAttribute }}</span>
        </div>

        <!-- Body: name + heroic ability, sigil as background watermark -->
        <div class="prof-body">

          <!-- Watermark sigil -->
          <div class="prof-watermark" aria-hidden="true">
            @switch (prof.name) {
              @case ('Artisan') {
                <svg width="72" height="72" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <line x1="50" y1="44" x2="50" y2="88" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
                  <line x1="24" y1="18" x2="76" y2="18" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
                  <line x1="24" y1="44" x2="76" y2="44" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
                  <line x1="24" y1="18" x2="24" y2="44" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
                  <line x1="76" y1="18" x2="76" y2="44" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
                </svg>
              }
              @case ('Bard') {
                <svg width="72" height="72" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M50,86 Q24,72 24,42 L32,18" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" fill="none"/>
                  <path d="M50,86 Q76,72 76,42 L68,18" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" fill="none"/>
                  <line x1="32" y1="18" x2="68" y2="18" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
                  <line x1="38" y1="42" x2="38" y2="74" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                  <line x1="50" y1="36" x2="50" y2="72" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                  <line x1="62" y1="42" x2="62" y2="74" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
              }
              @case ('Fighter') {
                <svg width="72" height="72" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <line x1="22" y1="22" x2="78" y2="78" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
                  <line x1="78" y1="22" x2="22" y2="78" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
                </svg>
              }
              @case ('Hunter') {
                <svg width="72" height="72" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <line x1="24" y1="76" x2="72" y2="28" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
                  <line x1="72" y1="28" x2="52" y2="32" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
                  <line x1="72" y1="28" x2="68" y2="48" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
                </svg>
              }
              @case ('Knight') {
                <svg width="72" height="72" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M20,18 L80,18 L80,60 L50,88 L20,60 Z" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round" fill="none"/>
                  <line x1="50" y1="18" x2="50" y2="88" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
                  <line x1="20" y1="44" x2="80" y2="44" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
                </svg>
              }
              @case ('Mage') {
                <svg width="72" height="72" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <polygon points="50,10 86,70 14,70" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round" fill="none"/>
                  <polygon points="50,90 14,30 86,30" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round" fill="none"/>
                </svg>
              }
              @case ('Mariner') {
                <svg width="72" height="72" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <circle cx="50" cy="24" r="10" stroke="currentColor" stroke-width="2.5" fill="none"/>
                  <line x1="50" y1="34" x2="50" y2="80" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
                  <line x1="28" y1="52" x2="72" y2="52" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
                  <path d="M28,52 Q20,72 36,80" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" fill="none"/>
                  <path d="M72,52 Q80,72 64,80" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" fill="none"/>
                </svg>
              }
              @case ('Merchant') {
                <svg width="72" height="72" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <line x1="50" y1="16" x2="50" y2="76" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
                  <line x1="22" y1="32" x2="78" y2="32" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
                  <line x1="28" y1="32" x2="22" y2="60" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                  <line x1="72" y1="32" x2="78" y2="60" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                  <line x1="14" y1="60" x2="30" y2="60" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
                  <line x1="70" y1="60" x2="86" y2="60" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
                  <line x1="38" y1="76" x2="62" y2="76" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
                </svg>
              }
              @case ('Scholar') {
                <svg width="72" height="72" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <line x1="50" y1="22" x2="50" y2="82" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                  <path d="M50,22 Q28,24 18,32 Q14,52 18,72 Q28,80 50,82" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" fill="none"/>
                  <path d="M50,22 Q72,24 82,32 Q86,52 82,72 Q72,80 50,82" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" fill="none"/>
                  <line x1="22" y1="48" x2="46" y2="46" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
                  <line x1="54" y1="46" x2="78" y2="48" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
                </svg>
              }
              @case ('Thief') {
                <svg width="72" height="72" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M14,50 Q50,18 86,50 Q50,82 14,50 Z" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round" fill="none"/>
                  <circle cx="50" cy="50" r="14" stroke="currentColor" stroke-width="2" fill="none"/>
                  <circle cx="50" cy="50" r="5" fill="currentColor"/>
                </svg>
              }
            }
          </div>

          <!-- Profession name -->
          <p class="prof-name">{{ prof.name }}</p>

          <!-- Heroic ability -->
          <div class="prof-ability-section">
            <p class="prof-ability-name">{{ prof.name === 'Mage' ? 'Magic' : prof.heroicAbilityName }}</p>
            <p class="prof-ability-desc">{{ prof.heroicAbilityDescription }}</p>
          </div>

        </div>

        <!-- Skills anchored at bottom -->
        <div class="prof-skills-bar">
          @for (skill of prof.skills; track skill) {
            <span class="skill-tag">{{ skill }}</span>
          }
        </div>

      </button>
    }
  </div>

  <app-step-nav backPath="kin" [canContinue]="!!selected" (next)="continue()" />

</div>
