<div class="step-animate-in">

  @if (pendingProfession()) {
    <app-confirm-modal
      title="Change Profession?"
      [message]="'Changing to ' + pendingProfession() + ' will reset your free skill picks.'"
      confirmLabel="Change Profession"
      (confirm)="confirmChange()"
      (cancel)="cancelChange()" />
  }

  <div class="mb-2 flex items-baseline justify-between">
    <h2 class="font-display font-semibold step-heading">
      Choose Your Profession
    </h2>
    <button (click)="rollRandom()" class="btn-roll">Roll D10</button>
  </div>
  <p class="mb-8 step-intro">
    Your profession grants a heroic ability and defines your core skills.
  </p>

  <div class="grid gap-3 sm:grid-cols-2">
    @for (prof of professions; track prof.name; let i = $index) {
      <button
        (click)="select(prof.name)"
        class="prof-card"
        [class.prof-selected]="selected === prof.name">

        <!-- Top bar: dice number + rolled badge + key attribute -->
        <div class="prof-top-bar">
          <div class="flex items-center gap-2 flex-1 min-w-0">
            <span class="prof-dice-num">D10 · {{ prof.diceRange }}</span>
            @if (rolledIndex() === i) {
              <span class="rolled-badge">Rolled</span>
            }
          </div>
          <span class="prof-attr-badge">{{ prof.keyAttribute }}</span>
        </div>

        <!-- Body: name + heroic ability, sigil as background watermark -->
        <div class="prof-body">

          <!-- Watermark sigil -->
          <div class="prof-watermark" aria-hidden="true">
            <app-icon [name]="'professions/' + prof.name.toLowerCase()" [size]="72" />
          </div>

          <!-- Profession name -->
          <p class="prof-name">{{ prof.name }}</p>

          <!-- Heroic ability -->
          <div class="prof-ability-section">
            <p class="prof-ability-name">{{ prof.name === 'Mage' ? 'Magic' : prof.heroicAbilityName }}</p>
            <p class="prof-ability-desc">{{ prof.heroicAbilityDescription }}</p>
          </div>

        </div>

        <!-- Skills anchored at bottom -->
        <div class="prof-skills-bar">
          @for (skill of prof.skills; track skill) {
            <span class="skill-tag">{{ skill }}</span>
          }
        </div>

      </button>
    }
  </div>

  <app-step-nav backPath="kin" [canContinue]="!!selected" (next)="continue()" />

</div>
