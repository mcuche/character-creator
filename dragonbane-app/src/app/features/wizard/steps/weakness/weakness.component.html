<div class="step-animate-in">

  <h2 class="mb-2 font-display font-semibold step-heading">Weakness</h2>
  <p class="mb-8 step-intro">
    An optional character flaw. Acting against your weakness grants 2 advancement marks, then removes it.
  </p>

  @if (!expanded()) {
    <button
      type="button"
      (click)="toggle()"
      class="add-slot">
      <span class="add-slot-label">+ Add a Weakness</span>
      <span class="card-meta">Or continue without one.</span>
    </button>
  } @else {
    <div class="mb-3 flex items-center justify-between gap-4">
      <h3 class="section-label">Choose a weakness</h3>
      <button type="button" (click)="toggle()" class="btn-roll inline-flex min-h-11 items-center">Remove</button>
    </div>

    <!-- Suggestions -->
    <div class="mb-8 flex flex-wrap gap-2">
      @for (w of suggestions; track w) {
        <button
          type="button"
          (click)="selectSuggestion(w)"
          class="choice-chip"
          [class.selected]="weaknessText() === w"
          [attr.aria-pressed]="weaknessText() === w">
          {{ w }}
        </button>
      }
    </div>

    <!-- Free text -->
    <label for="weakness-text" class="section-label block">Or write your own</label>
    <input
      id="weakness-text"
      type="text"
      [ngModel]="weaknessText()"
      (ngModelChange)="weaknessText.set($event)"
      placeholder="A flaw in your own words…"
      class="text-field"
    />
  }

  <app-step-nav
    backPath="skills"
    [canContinue]="true"
    (next)="continue()" />

</div>
